<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Skin Lesion Classifier — test upload</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.25rem; }
  #preview { max-width: 100%; margin-top: 12px; border-radius: 8px; display: none; }
  #result { margin-top: 20px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-family: monospace; }
  .bar-label { width: 60px; }
  .bar-track { flex: 1; background: #eee; border-radius: 4px; overflow: hidden; height: 16px; }
  .bar-fill { background: #4a90d9; height: 100%; }
  .bar-value { width: 56px; text-align: right; }
  .top { font-weight: bold; color: #1a6b1a; }
  #status { color: #666; margin-top: 12px; }
  #error { color: #c00; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Skin Lesion Classifier — test upload</h1>
  <p>Narzędzie deweloperskie do szybkiego testowania <code>POST /predict</code> — nie jest to docelowy frontend.</p>

  <input type="file" id="fileInput" accept="image/*">
  <img id="preview" alt="podgląd">

  <div id="status"></div>
  <div id="error"></div>
  <div id="result"></div>

<script>
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  resultEl.innerHTML = '';
  errorEl.textContent = '';
  statusEl.textContent = 'Analizuję...';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const response = await fetch('/predict', { method: 'POST', body: formData });
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.detail || `HTTP ${response.status}`);
    }

    statusEl.textContent = '';
    renderResult(data);
  } catch (err) {
    statusEl.textContent = '';
    errorEl.textContent = 'Błąd: ' + err.message;
  }
});

function renderResult(data) {
  const ranked = Object.entries(data.probabilities).sort((a, b) => b[1] - a[1]);
  const rows = ranked.map(([cls, prob]) => {
    const pct = (prob * 100).toFixed(1);
    const isTop = cls === data.predicted_class;
    return `
      <div class="bar-row ${isTop ? 'top' : ''}">
        <span class="bar-label">${cls}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
        <span class="bar-value">${pct}%</span>
      </div>`;
  }).join('');

  resultEl.innerHTML = `<p>Przewidziana klasa: <span class="top">${data.predicted_class}</span></p>${rows}`;
}
</script>
</body>
</html>
